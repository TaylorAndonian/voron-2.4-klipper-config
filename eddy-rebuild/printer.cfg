# ============================================================================
#  Voron 2.4 350  --  Octopus Pro (STM32H723) + EBB SB2209/2240 CAN toolboard
#  Toolhead: Xol  |  Hotend: Revo Voron  |  Extruder: rotation_distance 4.69
#
#  PROBING ARCHITECTURE (read this before changing anything)
#  ---------------------------------------------------------
#    E3D PZ piezo  -> PHYSICAL Z ENDSTOP on [stepper_z] endstop_pin.
#                     Nozzle-contact = true Z zero. Immune to thermal drift
#                     and unaffected by Revo nozzle swaps.
#
#    BTT Eddy Duo  -> THE [probe] OBJECT (via [probe_eddy_current btt_eddy]).
#                     Used for QUAD_GANTRY_LEVEL and BED_MESH_CALIBRATE only.
#                     NEVER used for Z homing.
#
#  WHY IT IS WIRED THIS WAY: Klipper allows exactly one object named "probe".
#  [probe] and [probe_eddy_current] BOTH call add_object('probe', self), so
#  they cannot coexist -- Klipper aborts with "Printer object 'probe' already
#  created". Demoting the piezo to a plain endstop is the only arrangement in
#  mainline Klipper that gives you piezo Z-homing AND Eddy meshing.
# ============================================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_0C003A000851323235363233-if00
restart_method: command

[mcu EBBCan]
canbus_uuid: 894b34cdd258

[include mainsail.cfg]
[include KAMP_Settings.cfg]
[include test_speed.cfg]
[include eddy.cfg]
[include macros.cfg]

[exclude_object]
[idle_timeout]
timeout: 1800

# NOTE: [virtual_sdcard], [pause_resume], [display_status] and [respond] are
# declared by mainsail.cfg. They used to be duplicated here as well. Klipper
# tolerates that (its parser merges duplicate sections) but it is confusing,
# so they now live in exactly one place.

# ============================================================================
#  Kinematics
# ============================================================================

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 10000
max_z_velocity: 20
max_z_accel: 200           # PIEZO: kept low. A hard Z motor start puts a
                           # mechanical pulse into the piezo and causes false
                           # triggers on the first millimetre of descent.
square_corner_velocity: 5.0

# ============================================================================
#  X / Y
# ============================================================================

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: !PG6
position_min: 0
position_endstop: 340
position_max: 340
homing_speed: 250
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: PG9
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 250
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# ============================================================================
#  Z  --  homed by the PIEZO acting as a physical endstop
# ============================================================================
#  CHANGED: endstop_pin was "probe:z_virtual_endstop" pointing at the [probe]
#  section. The [probe] section is gone (the Eddy owns "probe" now), so the
#  piezo trigger pin is wired directly here.
#
#  Pin polarity is unchanged: the old [probe] used "pin: !EBBCan:PB9",
#  so the endstop is "!EBBCan:PB9". The PZ board's trigger output is
#  active-low by default, which is what the "!" is doing.
#
#  position_endstop MUST be verified before your first print -- see RUNBOOK
#  step 9. 0.0 is the physically honest starting value for a nozzle-contact
#  endstop (trigger == nozzle touching bed) and errs on the safe side.

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

endstop_pin: !EBBCan:PB9
position_endstop: 0.0
position_max: 310
position_min: -5

homing_speed: 20           # PIEZO: your existing, known-good values. The
second_homing_speed: 10    # piezo needs impact rate to build force; slower
homing_retract_dist: 3     # is NOT safer here, it under-triggers.

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# ============================================================================
#  Extruder / Heaters
# ============================================================================

[extruder]
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 4.69                 # calibrated -- left untouched
nozzle_diameter: 0.40
filament_diameter: 1.750
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
max_extrude_cross_section: 5            # required by KAMP LINE_PURGE
pressure_advance: 0.025
pressure_advance_smooth_time: 0.03
heater_pin: EBBCan:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan:PA3
pullup_resistor: 4700
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp: 170
step_pin: EBBCan:PD0
dir_pin: EBBCan:PD1
enable_pin: !EBBCan:PD2

[tmc2209 extruder]
uart_pin: EBBCan:PA15
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.6
min_temp: 0
max_temp: 120

# ============================================================================
#  Fans
# ============================================================================

[fan]
pin: EBBCan:PA0
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: EBBCan:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[controller_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed

# ============================================================================
#  Homing / Levelling
# ============================================================================

[safe_z_home]
home_xy_position: 175, 175      # bed centre on a 350
speed: 100
z_hop: 5
z_hop_speed: 10

# QGL is KEPT and now runs on the Eddy.
# A bed mesh cannot substitute for QGL on a 2.4 -- four independent Z motors
# have to be brought parallel to the bed before the mesh means anything.
#
# CHANGED: horizontal_move_z 5 -> 2. The Eddy coil sits ~2.95 mm ABOVE the
# nozzle tip, so at nozzle Z=5 the coil is ~8 mm off the bed and out of
# sensing range. 2 puts the coil at ~5 mm, which is BTT's validated figure.
# WATCH THE FIRST QGL after this change (RUNBOOK step 8).
# QGL points are PROBE coordinates -- Klipper drives the toolhead to
# (point - probe_offset). With y_offset 22.5 the two front points at Y=25 put
# the toolhead at Y=2.5, i.e. 2.5 mm from the front limit. Legal, but that is
# the tightest clearance anywhere in this config. If the Eddy ever moves
# further back, these are the first thing that will break (Klipper will throw
# "Move out of range" -- an error, not a crash). Raise both to Y=35 if you
# want breathing room; you lose a little probe spread and gain 10 mm margin.
[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
   50,25
   50,275
   300,275
   300,25
speed: 200                 # Eddy is non-contact, so the slow creep the piezo
                           # needed is gone. Kept at 200 rather than 300
                           # because horizontal_move_z is only 2 mm.
horizontal_move_z: 2
retries: 5
retry_tolerance: 0.0075    # Eddy is far more repeatable than the piezo was.
                           # If it will not converge, back off to 0.015.
max_adjust: 10

# ============================================================================
#  Display (BTT mini12864)
# ============================================================================

[board_pins]
aliases:
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[neopixel btt_mini12864]
pin: EXP1_6
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
    SET_LED LED=btt_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
    SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

