# ============================================================================
#  BTT Eddy Duo  --  USB mode  --  Voron 2.4 350 / Xol toolhead
#
#  ROLE: bed probing only.  QUAD_GANTRY_LEVEL + BED_MESH_CALIBRATE.
#        This is the [probe] object. It is NOT the Z endstop.
#        Z homing is the piezo, wired as [stepper_z] endstop_pin in printer.cfg.
#
#  STATUS: no placeholders left. Serial path and probe offsets are all real.
#          Remaining unknown: whether your Klipper wants descend_z or z_offset
#          (see the note further down). That is a one-line fix either way.
# ============================================================================

# ----------------------------------------------------------------------------
#  MCU
# ----------------------------------------------------------------------------
#  Confirmed present on the Pi via ls /dev/serial/by-id/
#  by-id rather than /dev/ttyACMx on purpose: ACM numbering can swap between
#  the Octopus and the Eddy across reboots, by-id cannot.

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044340408C93D1C-if00
restart_method: command

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

# ----------------------------------------------------------------------------
#  The probe
# ----------------------------------------------------------------------------
#  x_offset / y_offset -- MEASURED, see below. Method kept for reference.
#
#  The Xol "Eddie Module" probe mount and Drthsideous's Eddy Duo remix of it
#  publish NO offset figures -- I checked both the Printables page and the
#  Xol repo. The remix description only says the openings were widened a few
#  millimetres. So these have to come off your machine.
#
#  Procedure (Klipper's documented method, docs/Probe_Calibrate.md):
#    1. G28
#    2. Stick tape near bed centre, mark a fine dot on it.
#    3. Jog until the NOZZLE TIP is over the dot.   GET_POSITION -> Xn, Yn
#    4. Jog until the COIL CENTRE is over the dot.  GET_POSITION -> Xp, Yp
#    5. x_offset = Xn - Xp        y_offset = Yn - Yp
#
#  MIND THE ORDER: it is nozzle MINUS probe, not probe minus nozzle.
#  Klipper: "The x_offset is then the nozzle_x_position - probe_x_position".
#  Getting this backwards flips the sign and puts your mesh on the wrong part
#  of the bed with no error message.
#
#  Sanity check: on the Xol the coil sits BEHIND the nozzle, so y_offset must
#  come out POSITIVE and x_offset should be small. If your arithmetic gives a
#  negative y_offset, you have subtracted the wrong way round.
#
#  For scale only, a stock Stealthburner BTT mount is x_offset: 0 /
#  y_offset: 21.42. Do NOT copy that -- different carriage. It is here purely
#  to tell you what order of magnitude is believable.

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
i2c_mcu: eddy
i2c_bus: i2c0f

# MEASURED: coil is centred on the nozzle in X, and sits 22.5 mm toward the
# rear of the machine. Positive y_offset = coil behind the nozzle, which is
# what the Xol geometry demands. Sign verified.
# (Revised from an earlier 17.5 measurement.)
x_offset: 0.0
y_offset: 22.5

# --- descend_z vs z_offset ---------------------------------------------------
# Current mainline Klipper uses "descend_z" (the nominal nozzle-to-bed height a
# probing attempt stops at) and has DEPRECATED "z_offset" for this section --
# the nozzle relationship now comes entirely from the calibration table.
# Older Klipper builds still want z_offset.
#
# Check yours first:  in the Mainsail console run  PROBE_EDDY_CURRENT_CALIBRATE
# with no args -- if Klipper starts up at all with the line below, you are on
# a descend_z build. If Klipper refuses to start with
# "Option 'descend_z' is not valid", comment it out and use the z_offset line.
descend_z: 1.0
#z_offset: 2.5             # <- only if your Klipper predates the descend_z change

speed: 5
lift_speed: 10
samples: 3
samples_result: median
samples_tolerance: 0.020
samples_tolerance_retries: 3

# ----------------------------------------------------------------------------
#  Thermal drift compensation
# ----------------------------------------------------------------------------
#  This is the entire reason the Duo was the right buy over the Coil, and on a
#  2.4 running a hot chamber it is not optional. Calibrated in RUNBOOK step 12.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

# ----------------------------------------------------------------------------
#  Bed mesh
# ----------------------------------------------------------------------------
#  Bounds are the coordinates the COIL must reach, not the nozzle. BTT's rule:
#     mesh_x_min = position_min_x + max(15, x_offset  if positive else 0)
#     mesh_y_min = position_min_y + max(15, y_offset  if positive else 0)
#     mesh_x_max = position_max_x - max(15, |x_offset| if negative else 0)
#     mesh_y_max = position_max_y - max(15, |y_offset| if negative else 0)
#
#  Your machine: position_max_x 340, position_max_y 350, mins 0.
#  With x_offset 0 and y_offset 22.5 the formula gives 15,22.5 -> 325,335.
#  A mesh_y_min of 22.5 puts the toolhead at exactly Y=0.0 with no margin at
#  all, so it is raised to 28 (toolhead 5.5). X is pulled in to 20 to stay
#  clear of bed clips.
#
#  Reachability check, all four corners:
#     coil (20,28)   -> toolhead (20, 5.5)     OK
#     coil (325,28)  -> toolhead (325, 5.5)    OK  (x max 340)
#     coil (20,330)  -> toolhead (20, 307.5)   OK
#     coil (325,330) -> toolhead (325, 307.5)  OK

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 20, 28
mesh_max: 325, 330
probe_count: 9, 9
algorithm: bicubic
fade_start: 1
fade_end: 10
# NOW SAFE TO ENABLE, given x_offset is 0 and the scan spans X 20..325:
#   right end 325 + 8 = 333, under position_max_x 340
#   left end   20 - 8 =  12, above position_min_x 0
# Overshoot lets the toolhead decelerate outside the mesh instead of inside it,
# which makes rapid scan smoother and the edge rows more trustworthy.
scan_overshoot: 8

# ============================================================================
#  Calibration helpers
# ============================================================================

# The BTT sample ships a PROBE_EDDY_CURRENT_CALIBRATE_AUTO that fakes a Z
# position with SET_KINEMATIC_POSITION, because on a normal Eddy build there
# is a chicken-and-egg problem: you cannot home Z until the Eddy is calibrated.
#
# You do not have that problem. The piezo homes Z independently, so we can
# home for real and calibrate against a genuine zero. This is both safer and
# more accurate than the stock macro.
[gcode_macro EDDY_CALIBRATE]
description: Map Eddy frequency to height (run after EDDY_DRIVE_CURRENT)
gcode:
    BED_MESH_CLEAR
    G28
    G90
    G1 X175 Y175 F6000
    # Park at Z=1, not Z=5. This drops you into the manual-probe session one
    # millimetre off the bed instead of five, so it is two or three TESTZ
    # steps to the paper instead of thirty. Safe because Z_ENDSTOP_CALIBRATE
    # has already established a real zero.
    G1 Z1 F600
    M118 Manual probe starts at Z=1.0.
    M118 Slide paper under the nozzle, then: TESTZ Z=-0.1 until it just drags.
    M118 If the paper grips at roughly Z=0, your piezo zero is good.
    M118 If you end up past -0.15 or +0.15, STOP - redo Z_ENDSTOP_CALIBRATE.
    M118 Then ACCEPT. Klipper sweeps the coil and builds the frequency table.
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy

[gcode_macro EDDY_DRIVE_CURRENT]
description: Step 1 of Eddy calibration - drive current at 20mm above bed
gcode:
    G28
    G90
    G1 X175 Y175 F6000
    G1 Z20 F1200
    M118 Sensor is 20mm up. Running drive current calibration.
    LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy

[gcode_macro MESH]
description: Full-bed Eddy rapid scan
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    BED_MESH_CLEAR
    # METHOD=rapid_scan, NOT "METHOD=scan SCAN_MODE=rapid".
    # Mainline Klipper takes METHOD=[manual|automatic|scan|rapid_scan] and has
    # no SCAN_MODE parameter at all. BTT's own guides still print the old form;
    # it does not error, the unknown parameter is simply ignored, and you
    # silently get a slow non-rapid scan.
    BED_MESH_CALIBRATE METHOD=rapid_scan
    BED_MESH_PROFILE SAVE=default

# ----------------------------------------------------------------------------
#  Repeatability checks
# ----------------------------------------------------------------------------

[gcode_macro TEST_EDDY]
description: Eddy probe repeatability at bed centre
gcode:
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    G1 X175 Y175 F9000
    G1 Z2 F600
    PROBE_ACCURACY SAMPLES=10

# Piezo repeatability, measured with the Eddy as the ruler.
# Home Z on the piezo, then ask the Eddy how high the nozzle actually ended up.
# The spread of the reported values IS the piezo's repeatability (Eddy noise is
# roughly an order of magnitude smaller and washes out).
# Good result: total spread under ~0.010 mm. Over ~0.025 mm means go hunting
# for loose heatsets, slack Z belts, or coldside-to-carriage interference --
# the classic PZ-on-a-printed-carriage failure mode.
[gcode_macro TEST_PIEZO]
description: Piezo Z-home repeatability, measured against the Eddy
gcode:
    {% set n = params.SAMPLES|default(8)|int %}
    G28
    G90
    M118 Piezo repeatability: {n} samples. Each line is one fresh piezo home.
    {% for i in range(n) %}
        _PIEZO_SAMPLE
    {% endfor %}
    M118 Done. Spread under 0.010mm is healthy; over 0.025mm needs investigating.

[gcode_macro _PIEZO_SAMPLE]
gcode:
    PIEZO_CURRENT_LOW
    G28 Z
    PIEZO_CURRENT_NORMAL
    G90
    G1 X175 Y175 F9000
    G1 Z2 F600
    PROBE SAMPLES=1
    _PIEZO_REPORT

# This is a separate macro on purpose, and it matters.
# Klipper renders a macro's ENTIRE template before executing any of its
# commands. So if the M118 below lived inside _PIEZO_SAMPLE, the value of
# last_z_result would be baked in at render time -- i.e. the result of the
# PREVIOUS probe, not the one on the line above it. Every sample would report
# a stale number and the test would be worthless while looking like it worked.
# Splitting the report into its own macro forces it to render after PROBE has
# actually completed.
[gcode_macro _PIEZO_REPORT]
gcode:
    M118 eddy reads { printer.probe.last_z_result }
