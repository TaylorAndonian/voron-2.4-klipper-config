[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_0C003A000851323235363233-if00
restart_method: command

[mcu EBBCan]
canbus_uuid: 894b34cdd258

[include mainsail.cfg]

[include KAMP_Settings.cfg]

[include test_speed.cfg]

[exclude_object]

[printer]
kinematics: corexy
max_velocity: 600          # travel/homing ceiling — validate with TEST_SPEED
max_accel: 10000           # ceiling only; prints use slicer accel. Needs input shaper to print clean this high
max_z_velocity: 20         # belted Z on a 2.4 handles this fine
max_z_accel: 200           # PZ-PROBE MOD: was 800. Softer Z motor start = no piezo pulse
                           # at the beginning of each probe descent (your false-trigger symptom).
                           # QGL corrections are tiny; you will not notice the speed difference.
square_corner_velocity: 5.0

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: !PG6
position_min: 0
position_endstop: 340
position_max: 340
homing_speed: 250
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:200
endstop_pin: PG9
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 250
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

endstop_pin: probe:z_virtual_endstop

position_max: 310
position_min: -5

homing_speed: 20
second_homing_speed: 10
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.80
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0


[extruder]
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 4.69
nozzle_diameter: 0.40                              #define nozzle diameter
filament_diameter: 1.750
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.025                #to be calibrated
pressure_advance_smooth_time: 0.03     #to be calibrated
heater_pin: EBBCan:PB13
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan:PA3
pullup_resistor: 4700
min_temp: 10
max_temp: 300
max_power: 1.0
min_extrude_temp:170
step_pin: EBBCan:PD0
dir_pin: EBBCan:PD1
enable_pin: !EBBCan:PD2
max_extrude_cross_section: 5

[tmc2209 extruder]
uart_pin: EBBCan:PA15
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

[heater_bed]
heater_pin: PA3
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 0.6
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[probe]
pin:!EBBCan:PB9
z_offset: 0
x_offset: 0.0
y_offset: 0.0

# PZ-PROBE MOD: probe at the speed that already triggers reliably for you.
# Your Z homing touches off at second_homing_speed 10 mm/s and "works perfectly".
# At 5 mm/s the impact force builds too slowly -> toolhead flexes before the
# piezo threshold is crossed (your late-trigger symptom). E3D allows up to
# 20 mm/s with reduced motor current; 10 is the sweet spot here.
speed: 5
lift_speed: 10

# PZ-PROBE MOD: 3 samples with median instead of 2 averaged — one bad
# reading gets discarded instead of polluting the average.
samples: 3
samples_result: median
sample_retract_dist: 5.0

# PZ-PROBE MOD: was 0.05 — that accepted 50um of disagreement between samples
# while QGL tries to converge to 0.02. Probe noise must be smaller than the
# QGL target or it can never settle. 0.015 forces a re-probe of noisy points.
samples_tolerance: 0.015
samples_tolerance_retries: 8

activate_gcode:
    G4 P800                     ; settle before first touch (was 2000 — 800 is plenty with slower travel below)

deactivate_gcode:
    G4 P300

[fan]
pin: EBBCan:PA0
kick_start_time: 0.5
off_below: 0.10

[heater_fan hotend_fan]
pin: EBBCan:PA1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0

[controller_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed

##  Exhaust fan - FAN3
#[heater_fan exhaust_fan]
#pin: PD13
#max_power: 1.0
#shutdown_speed: 0.0
#kick_start_time: 5.0
#heater: heater_bed
#heater_temp: 60
#fan_speed: 1.0

#####################################################################
#   LED Control
#####################################################################

## Chamber Lighting - HE2 Connector (Optional)
#[output_pin caselight]
##Octopus 1.0 & 1.1, Octopus PRO 1.0
#pin: PB10
##Octopus PRO 1.1
#pin: PB0
#pwm:true
#shutdown_value: 0
#value:1
#cycle_time: 0.01

[idle_timeout]
timeout: 1800

[safe_z_home]
home_xy_position: 175,175
speed: 100                 # was 100 — XY move to center
z_hop: 5
z_hop_speed: 10            # was 10 — just the lift, descent is still probe-controlled

[quad_gantry_level]
gantry_corners:
   -60,-10
   410,420
points:
   50,25
   50,275
   300,275
   300,25
# PZ-PROBE MOD: was 300 — a 300 mm/s dash between corners leaves the gantry
# ringing when the probe starts. 150 + the settle dwell = quiet piezo.
speed: 150
horizontal_move_z: 5
retries: 5
# Once probe samples are consistent you can tighten this to 0.01 (Voron
# default is 0.0075). Start at 0.02 and verify convergence first.
retry_tolerance: 0.02
max_adjust: 10

[board_pins]
aliases:
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,


    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

[display]
lcd_type: uc1701
cs_pin: EXP1_3
a0_pin: EXP1_4
rst_pin: EXP1_5
encoder_pins: ^EXP2_5, ^EXP2_3
click_pin: ^!EXP1_2
contrast: 63
spi_software_miso_pin: EXP2_1
spi_software_mosi_pin: EXP2_6
spi_software_sclk_pin: EXP2_2

[neopixel btt_mini12864]
pin: EXP1_6
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
        SET_LED LED=btt_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
        SET_LED LED=btt_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    SET_VELOCITY_LIMIT ACCEL=3000 SQUARE_CORNER_VELOCITY=5   # gentle accel so the gantry doesn't ring into a probe
    G90
    G28
    PROBE_CURRENT_LOW
    QUAD_GANTRY_LEVEL
    G28 Z
    PROBE_CURRENT_NORMAL
    PARK
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro PRINT_START]
description: Minimal PRINT_START: heat, home, QGL, purge (no bed mesh)
gcode:
    {% set BED    = params.BED|default(60)|float %}
    {% set HOTEND = (params.EXTRUDER|default(params.HOTEND|default(200)))|float %}
    {% set PROBE_TEMP = params.PROBE_TEMP|default(150)|float %}
    {% set SOAK_MIN = params.SOAK_MIN|default(0)|int %}
    {% set PURGE = params.PURGE|default("LINE")|string|upper %}

    # Start heating early
    M140 S{BED}
    {% set WARM = PROBE_TEMP %}
    {% if WARM > HOTEND %}
        {% set WARM = HOTEND %}
    {% endif %}
    M104 S{WARM}

    G90
    G92 E0

    # IMPORTANT: Wait bed temp BEFORE any Z probing / QGL
    M190 S{BED}

    # Optional soak time for thermal stability (recommended if you chase perfect first layers)
    {% if SOAK_MIN > 0 %}
        G4 P{SOAK_MIN * 60000}
    {% endif %}

    # Bring nozzle to probing temp consistently
    M109 S{WARM}

    # PZ-PROBE MOD: brief pause so the piezo isn't reading heater/fan PWM
    # transients the instant heating settles
    G4 P500

# Home + QGL (fast travel, gentle accel during probing for the piezo)
    SET_VELOCITY_LIMIT ACCEL=3000 SQUARE_CORNER_VELOCITY=5
    G28
    PROBE_CURRENT_LOW
    QUAD_GANTRY_LEVEL
    G28 Z
    PROBE_CURRENT_NORMAL
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}

    # Final nozzle temp
    M109 S{HOTEND}

    {% if PURGE == "VORON" %}
        VORON_PURGE
    {% elif PURGE == "NONE" %}
        ; no purge
    {% else %}
        LINE_PURGE
    {% endif %}


[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400
    G92 E0
    G1 E-5.0 F1800

    TURN_OFF_HEATERS

    G90
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600
    M107

    BED_MESH_CLEAR

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[gcode_macro PROBE_CURRENT_LOW]
gcode:
    # PZ-PROBE MOD: was 0.40 — E3D recommends 40% of run current (0.32 here)
    # or lower. Less current = less motor vibration into the piezo AND a softer
    # crash if a trigger is ever missed. If a Z stepper skips during QGL,
    # raise back toward 0.40.
    SET_TMC_CURRENT STEPPER=stepper_z  CURRENT=0.35
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=0.35
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT=0.35
    SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT=0.35
    G4 P500

[gcode_macro PROBE_CURRENT_NORMAL]
gcode:
    SET_TMC_CURRENT STEPPER=stepper_z  CURRENT=0.80
    SET_TMC_CURRENT STEPPER=stepper_z1 CURRENT=0.80
    SET_TMC_CURRENT STEPPER=stepper_z2 CURRENT=0.80
    SET_TMC_CURRENT STEPPER=stepper_z3 CURRENT=0.80
    G4 P100

# PZ-PROBE MOD: run this once after flashing the config, with bed and nozzle
# at probing temps. 10 probes at bed center; you want range <= 0.0125 and
# standard deviation well under 0.01. If it passes, tighten
# [quad_gantry_level] retry_tolerance to 0.01.
[gcode_macro TEST_PZ]
description: Probe repeatability check at bed center with QGL current/settings
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    PROBE_CURRENT_LOW
    G90
    G0 X175 Y175 Z10 F9000
    G4 P800
    PROBE_ACCURACY SAMPLES=10
    PROBE_CURRENT_NORMAL

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 20, 20
mesh_max: 330, 330
probe_count: 5,5
algorithm: bicubic
fade_start: 1
fade_end: 10

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

