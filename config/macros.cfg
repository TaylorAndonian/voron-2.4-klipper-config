# ============================================================================
#  Macros  --  Voron 2.4 350 / Xol / Revo Voron / piezo Z + Eddy mesh
#
#  ORDER OF OPERATIONS EVERYWHERE:
#      nozzle clean  ->  piezo Z home  ->  QGL (Eddy)  ->  Eddy mesh  ->  purge
#  The Eddy never scans until the nozzle has been wiped, because a blob on the
#  tip corrupts the nozzle-to-bed relationship the whole mesh is referenced to.
# ============================================================================

# ============================================================================
#  _CFG  --  every tunable in one place. Edit here, not inside the macros.
# ============================================================================
[gcode_macro _CFG]
description: Central settings for the macro suite (does nothing when run)
# --- nozzle brush -----------------------------------------------------------
#  MEASURE ME.
#  Nothing in your existing config defines a brush or bucket, so I have to
#  assume you do not have one fitted yet. brush_enable stays False until you
#  give me real coordinates. A wipe macro with guessed coordinates is a
#  toolhead crash, and that is the one thing I will not do blind.
#
#  When you have a brush, measure:
#    brush_start_x / brush_end_x  the X span the nozzle sweeps across
#    brush_y                      the Y centre line of the bristles
#    brush_z                      Z with the nozzle INTO the bristles.
#                                 Start 1 mm high and creep down in 0.2 steps.
#  Then set brush_enable: True.
variable_brush_enable:      True
variable_brush_start_x:     10.0
variable_brush_end_x:       49.0
variable_brush_y:           350.0
variable_brush_z:           0.0
variable_brush_gantry:      True     # brush rides on the Z gantry: skip all Z moves
variable_park_x:            7.0      # silicone nozzle stop, X
variable_park_y:            350.0    # silicone nozzle stop, Y
variable_purge_offset_x:    10.0     # spit filament this far right of the brush
variable_purge_park_y:      350.0    # ...on the brush line
variable_brush_passes:      6
variable_brush_speed:       6000     # mm/min for the wipe strokes
variable_brush_approach_z:  10.0     # safe travel height near the brush

# --- temperatures -----------------------------------------------------------
#  clean_temp MUST stay above [extruder] min_extrude_temp (yours is 170) or
#  Klipper refuses the ooze-control retract and the whole point is lost.
#  180 is hot enough to shed residue, cool enough not to gush.
variable_clean_temp:        180
variable_load_temp:         240
variable_unload_temp:       240

# --- ooze control -----------------------------------------------------------
#  2.0 mm is deliberate. The Revo heat break is short; past roughly 4 mm you
#  start pulling soft filament into the cold zone and inviting a jam.
variable_ooze_retract:      2.0
variable_start_retract:     5.0      # PRINT_START: pull back this far before the first wipe
variable_retract_speed:     2400     # mm/min (40 mm/s)
variable_prime_speed:       1800     # mm/min (30 mm/s)

# --- load / unload ----------------------------------------------------------
#  Sherpa-Mini-class extruder into a Revo Voron: gears to melt zone is ~45 mm.
#  VERIFY the first time -- run LOAD_FILAMENT and watch. Filament arriving
#  early means load_fast is too big; late means too small.
variable_load_fast:         45
variable_load_fast_speed:   600      # mm/min (10 mm/s)
variable_load_purge:        30
variable_load_purge_speed:  180      # mm/min (3 mm/s), melt-rate limited

variable_unload_soften:     5        # push first, softens the tip
variable_unload_tip_1:      2        # quick snap to shape the tip
variable_unload_tip_speed:  3000
variable_unload_tip_2:      5        # slow pull, lets the tip set
variable_unload_tip2_speed: 300
variable_unload_fast:       85       # clear of the drive gears
variable_unload_fast_speed: 1800

# --- fallback purge line (used only when the slicer gives no object data) ---
variable_purge_x:           15.0
variable_purge_y:           5.0
variable_purge_z:           0.35
variable_purge_len:         90.0
variable_purge_extrude:     14.0
gcode:
    RESPOND MSG="_CFG stores settings only."

# ============================================================================
#  Z motor current around piezo homing
# ============================================================================
#  Renamed from PROBE_CURRENT_* because "probe" now means the Eddy, and the
#  Eddy never touches anything. These are purely a piezo concern.



# ============================================================================
#  CLEAN_NOZZLE
# ============================================================================
#  heat -> retract -> travel high -> scrub -> lift -> prime back
#
#  Params:
#    TEMP=      clean temperature (default _CFG clean_temp)
#    NOHEAT=1   do not touch the heater at all. USE THIS whenever the nozzle
#               is already hotter than clean_temp -- M109 waits for COOLING
#               too, so without it PRINT_END would sit there for minutes
#               dropping 250C to 180C before it would wipe.
#    RETRACT=0  skip the retract (caller already retracted)
#    PRIME=0    do not push filament back afterwards
[gcode_macro CLEAN_NOZZLE]
description: Heat, retract and scrub the nozzle on the brush
gcode:
    {% set c = printer["gcode_macro _CFG"] %}
    {% set temp       = params.TEMP|default(c.clean_temp)|float %}
    {% set noheat     = params.NOHEAT|default(0)|int %}
    {% set do_retract = params.RETRACT|default(1)|int %}
    {% set do_prime   = params.PRIME|default(1)|int %}
    {% set gantry     = c.brush_gantry|default(0)|int %}
    {% set ha         = printer.toolhead.homed_axes %}
    {% set ready      = ('x' in ha and 'y' in ha) if gantry else ('xyz' in ha) %}

    {% if not c.brush_enable %}
        RESPOND TYPE=error MSG="CLEAN_NOZZLE skipped: no brush configured. Fill in brush_* and set brush_enable: True in _CFG (macros.cfg)."
    {% elif not ready %}
        RESPOND TYPE=error MSG="CLEAN_NOZZLE skipped: X/Y not homed, cannot reach the brush."
    {% else %}
        SAVE_GCODE_STATE NAME=CLEAN_NOZZLE
        G90

        # 1. temperature
        {% if not noheat %}
            M109 S{temp}
        {% endif %}

        # 2. stop the drool before going anywhere near the bristles
        {% if do_retract and printer.extruder.can_extrude %}
            M83
            G1 E-{c.ooze_retract} F{c.retract_speed}
        {% endif %}

        # 3. travel to the brush
        #    A gantry-mounted brush rides up and down with the toolhead, so the
        #    nozzle-to-bristle depth never changes and every Z move here is
        #    wasted motion. Only lift and plunge for a bed/frame-mounted brush.
        {% if not gantry %}
            G1 Z{c.brush_approach_z} F1200
        {% endif %}
        G1 X{c.brush_end_x} Y{c.brush_y} F{c.brush_speed}   # enter from the right
        {% if not gantry %}
            G1 Z{c.brush_z} F600
        {% endif %}

        # 4. scrub
        {% for i in range(c.brush_passes|int) %}
            G1 X{c.brush_start_x} F{c.brush_speed}
            G1 X{c.brush_end_x}   F{c.brush_speed}
        {% endfor %}

        # 5. clear the brush before anything else moves
        {% if not gantry %}
            G1 Z{c.brush_approach_z} F1200
        {% endif %}

        # 6. put the filament back
        {% if do_prime and do_retract and printer.extruder.can_extrude %}
            M83
            G1 E{c.ooze_retract} F{c.prime_speed}
            G1 E-0.4 F{c.retract_speed}      # small hold-back so it does not weep
        {% endif %}

        RESTORE_GCODE_STATE NAME=CLEAN_NOZZLE
    {% endif %}


[gcode_macro PARK_NOZZLE]
description: Sit the nozzle on the silicone stop so it cannot ooze
gcode:
    {% set c = printer["gcode_macro _CFG"] %}
    {% set do_retract = params.RETRACT|default(1)|int %}
    {% set ha = printer.toolhead.homed_axes %}
    {% set gantry = c.brush_gantry|default(0)|int %}
    {% if not (('x' in ha and 'y' in ha) if gantry else ('xyz' in ha)) %}
        RESPOND TYPE=error MSG="PARK_NOZZLE skipped: X/Y not homed."
    {% else %}
        SAVE_GCODE_STATE NAME=PARK_NOZZLE
        G90
        {% if do_retract and printer.extruder.can_extrude %}
            M83
            G1 E-{c.ooze_retract} F{c.retract_speed}
        {% endif %}
        G1 X{c.park_x} Y{c.park_y} F{c.brush_speed}
        RESTORE_GCODE_STATE NAME=PARK_NOZZLE MOVE=0
    {% endif %}

# ============================================================================
#  LOAD / UNLOAD
# ============================================================================
#  Names are exact on purpose: KlipperScreen's filament panel binds to macros
#  called LOAD_FILAMENT and UNLOAD_FILAMENT. Mainsail and Fluidd list them
#  because they carry a description. No extra config needed for either UI.

[gcode_macro LOAD_FILAMENT]
description: Heat, purge clear of the brush, wipe the nozzle and park
gcode:
    {% set c = printer["gcode_macro _CFG"] %}
    {% set temp  = params.TEMP|default(c.load_temp)|float %}
    {% set homed = 'xyz' in printer.toolhead.homed_axes %}
    {% set px    = c.brush_end_x|float + c.purge_offset_x|float %}

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT
    {% if printer.extruder.target < temp or printer.extruder.temperature < (temp - 5) %}
        RESPOND MSG="Heating to {temp}C to load..."
        M109 S{temp}
    {% endif %}

    # get clear of the bristles before anything comes out of the nozzle
    {% if homed %}
        G90
        G1 X{px} Y{c.purge_park_y} F{c.brush_speed}
    {% else %}
        RESPOND TYPE=error MSG="Not homed: loading in place, no purge move / wipe / park. Home first for the full sequence."
    {% endif %}

    M83
    G1 E{c.load_fast}  F{c.load_fast_speed}        # feed down to the melt zone
    G1 E{c.load_purge} F{c.load_purge_speed}       # establish real flow
    G4 P1500                                       # let pressure equalise
    G1 E-{c.ooze_retract} F{c.retract_speed}       # ooze control before moving

    {% if homed %}
        CLEAN_NOZZLE NOHEAT=1 RETRACT=0 PRIME=0
    {% endif %}

    M83
    G1 E{c.ooze_retract} F{c.prime_speed}
    G1 E-0.6 F{c.retract_speed}                    # park slightly back

    {% if homed %}
        PARK_NOZZLE RETRACT=0
        RESPOND MSG="Filament loaded, nozzle wiped and parked on the stop. Still hot."
    {% else %}
        RESPOND MSG="Filament loaded. Nozzle is still hot."
    {% endif %}
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT

[gcode_macro UNLOAD_FILAMENT]
description: Heat, form a clean tip clear of the brush, wipe the nozzle and park
gcode:
    {% set c = printer["gcode_macro _CFG"] %}
    {% set temp  = params.TEMP|default(c.unload_temp)|float %}
    {% set homed = 'xyz' in printer.toolhead.homed_axes %}
    {% set px    = c.brush_end_x|float + c.purge_offset_x|float %}

    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT
    {% if printer.extruder.target < temp or printer.extruder.temperature < (temp - 5) %}
        RESPOND MSG="Heating to {temp}C to unload..."
        M109 S{temp}
    {% endif %}

    # the tip-forming push oozes, so do it clear of the bristles
    {% if homed %}
        G90
        G1 X{px} Y{c.purge_park_y} F{c.brush_speed}
    {% else %}
        RESPOND TYPE=error MSG="Not homed: unloading in place, no purge move / wipe / park. Home first for the full sequence."
    {% endif %}

    M83
    G1 E{c.unload_soften} F{c.load_purge_speed}       # soften the tip
    G1 E-{c.unload_tip_1} F{c.unload_tip_speed}       # snap back to shape it
    G4 P600                                           # let the tip set
    G1 E-{c.unload_tip_2} F{c.unload_tip2_speed}      # ease out of the melt zone
    G1 E-{c.unload_fast}  F{c.unload_fast_speed}      # clear the drive gears

    {% if homed %}
        CLEAN_NOZZLE NOHEAT=1 RETRACT=0 PRIME=0
        PARK_NOZZLE RETRACT=0
        RESPOND MSG="Filament unloaded, nozzle wiped and parked. Still hot - turn it off when done."
    {% else %}
        RESPOND MSG="Filament unloaded. Nozzle still hot - turn it off when done."
    {% endif %}
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT

# ============================================================================
#  Purge
# ============================================================================
#  Prefers KAMP's adaptive LINE_PURGE, drawn just in front of the actual print
#  so it is never in the way. Falls back to a fixed front-left line when the
#  slicer has emitted no object data.
#  KAMP's variable_tip_distance is set to 2 in KAMP_Settings.cfg to match the
#  2 mm of ooze retract we are carrying -- that is what stops the first
#  extrusion being mostly air.
[gcode_macro PURGE_LINE]
description: Adaptive purge line with a fixed-position fallback
gcode:
    {% set c = printer["gcode_macro _CFG"] %}
    {% set have_objects = printer.exclude_object is defined
                          and printer.exclude_object.objects|length > 0 %}

    {% if have_objects %}
        LINE_PURGE
    {% else %}
        RESPOND MSG="No slicer object data - using the fixed purge line."
        SAVE_GCODE_STATE NAME=PURGE_LINE
        G90
        G1 Z{c.brush_approach_z} F1200
        G1 X{c.purge_x} Y{c.purge_y} F9000
        G1 Z{c.purge_z} F600
        M83
        G1 E{c.ooze_retract + 1.0} F{c.prime_speed}    # recover retract + prime
        G4 P400                                        # let pressure build
        G1 X{c.purge_x + c.purge_len} E{c.purge_extrude} F900
        G1 E-0.6 F{c.retract_speed}
        G1 Z{c.purge_z + 3} F600                       # lift off the line
        G1 X{c.purge_x + c.purge_len + 15} F9000       # snap the tail away
        RESTORE_GCODE_STATE NAME=PURGE_LINE
    {% endif %}

# Guarded wrapper: SMART_PARK needs slicer object data and errors without it.
[gcode_macro _SMART_PARK_SAFE]
gcode:
    {% if printer.exclude_object is defined
          and printer.exclude_object.objects|length > 0 %}
        SMART_PARK
    {% else %}
        G90
        G1 Z10 F1200
    {% endif %}

# ============================================================================
#  Utility
# ============================================================================
[gcode_macro PARK]
description: Park the toolhead at bed centre
gcode:
    {% set th = printer.toolhead %}
    G90
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30 F6000

[gcode_macro G32]
description: Home, QGL on the Eddy, re-home Z, park
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32

# ============================================================================
#  PRINT_START
# ============================================================================
#  heat -> home -> clean -> piezo Z -> QGL -> piezo Z -> Eddy mesh
#       -> print temp -> re-wipe -> park -> purge -> print
#
#  Note on the first G28: Z has to be homed before CLEAN_NOZZLE can move to the
#  brush at a known height, so the very first Z home happens with a possibly
#  oozy nozzle. That home is provisional and thrown away -- the real zero is
#  the second one, after the wipe. We retract 2 mm before it to keep the mess
#  down.
#
#  Params (all optional):
#    BED=          bed temperature
#    EXTRUDER=     print temperature
#    CLEAN_TEMP=   wipe/probe temperature (default 180)
#    SOAK_MIN=     soak minutes once the bed is up to temperature
#    MESH=0        skip scanning, load the saved default profile instead
[gcode_macro PRINT_START]
description: Clean, piezo home, QGL, Eddy mesh, purge, print
gcode:
    {% set c       = printer["gcode_macro _CFG"] %}
    {% set BED     = params.BED|default(60)|float %}
    {% set HOTEND  = (params.EXTRUDER|default(params.HOTEND|default(240)))|float %}
    {% set CLEANT  = [params.CLEAN_TEMP|default(c.clean_temp)|float, HOTEND]|min %}
    {% set SOAK    = params.SOAK_MIN|default(0)|int %}
    {% set DO_MESH = params.MESH|default(1)|int %}

    G90
    M83
    BED_MESH_CLEAR

    # ---- 1. heat ----------------------------------------------------------
    RESPOND MSG="PRINT_START: bed {BED}C, nozzle {HOTEND}C"
    M140 S{BED}
    M104 S{CLEANT}
    M190 S{BED}
    {% if SOAK > 0 %}
        RESPOND MSG="Soaking {SOAK} min for thermal stability..."
        G4 P{SOAK * 60000}
    {% endif %}
    M109 S{CLEANT}
    G4 P500                     # let heater PWM transients settle off the piezo

    # ---- 2. pull the filament back, then home X/Y only --------------------
    #    X/Y is all we need to reach a gantry-mounted brush, and it keeps the
    #    dirty nozzle away from the bed until after the wipe. safe_z_home
    #    hops Z by 5 first, so nothing drags on the way.
    {% if printer.extruder.can_extrude %}
        M83
        G1 E-{c.start_retract} F{c.retract_speed}
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL=3000 SQUARE_CORNER_VELOCITY=5
    G28 X Y

    # ---- 3. wipe FIRST, then find Z with a clean nozzle -------------------
    CLEAN_NOZZLE NOHEAT=1 RETRACT=0 PRIME=0
    G28 Z

    # ---- 3b. put the filament back, wipe off what that pushed out ---------
    {% if printer.extruder.can_extrude %}
        M83
        G1 E{c.start_retract} F{c.prime_speed}
        G4 P250
    {% endif %}
    CLEAN_NOZZLE NOHEAT=1 RETRACT=0 PRIME=0

    # ---- 4. QGL on the Eddy, then re-home Z because the gantry moved ------
    QUAD_GANTRY_LEVEL
    G28 Z
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel} SQUARE_CORNER_VELOCITY={printer.configfile.settings.printer.square_corner_velocity}

    # ---- 5. Load the saved bed mesh (no scan) -----------------------------
    #    2026-08-17: per-print scanning removed. Re-scan by hand with the MESH
    #    macro whenever the plate or bed changes, then SAVE_CONFIG.
    #    MESH=0 runs with no compensation at all.
    {% if DO_MESH %}
        RESPOND MSG="Loading saved bed mesh..."
        BED_MESH_PROFILE LOAD=default
    {% else %}
        RESPOND MSG="Bed mesh disabled for this print."
        BED_MESH_CLEAR
    {% endif %}

    # ---- 6. print temp, prime the filament back, final wipe ---------------
    RESPOND MSG="Heating nozzle to {HOTEND}C"
    M109 S{HOTEND}
    CLEAN_NOZZLE NOHEAT=1 RETRACT=1 PRIME=1     # knock off whatever the prime pushed out

    # ---- 7. park close to the print, purge, go ----------------------------
    _SMART_PARK_SAFE
    PURGE_LINE
    G92 E0
    RESPOND MSG="PRINT_START complete."

# ============================================================================
#  PRINT_END
# ============================================================================
[gcode_macro PRINT_END]
description: Retract, wipe, park and shut down safely
gcode:
    {% set c  = printer["gcode_macro _CFG"] %}
    {% set th = printer.toolhead %}
    {% set z_safe = [th.position.z + 10, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                                            # let the print finish moving
    G92 E0
    M83
    {% if printer.extruder.can_extrude %}
        G1 E-{c.ooze_retract} F{c.retract_speed}    # modest, no cold-zone pull
    {% endif %}

    G90
    G1 Z{z_safe} F1200                              # clear the part first

    # Wipe while it is still hot. NOHEAT=1 matters here: without it M109 would
    # block waiting for the nozzle to COOL to clean_temp.
    CLEAN_NOZZLE NOHEAT=1 RETRACT=0 PRIME=0

    TURN_OFF_HEATERS
    M107                                            # part cooling off
    G1 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 5} F6000
    BED_MESH_CLEAR
    M84

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    RESPOND MSG="Print complete."


# ============================================================================
#  PAUSE / RESUME HOOKS
# ============================================================================
#  Mainsail's PAUSE runs:  PAUSE_BASE -> user_pause_macro -> park
#  Mainsail's RESUME runs: restore temp -> user_resume_macro -> unretract -> resume
#  So the wipe happens on the way out, and again on the way back in, and the
#  park position below drops the nozzle onto the silicone stop while it waits.
#  Do not edit mainsail.cfg for this -- it is overwritten on every update.

[gcode_macro _PAUSE_CLEAN]
description: PAUSE hook: wipe the nozzle before it parks on the silicone stop
gcode:
    {% if printer["gcode_macro _CFG"].brush_enable %}
        CLEAN_NOZZLE NOHEAT=1
    {% endif %}

[gcode_macro _RESUME_CLEAN]
description: RESUME hook: wipe off any weep before going back to the print
gcode:
    {% if printer["gcode_macro _CFG"].brush_enable %}
        CLEAN_NOZZLE NOHEAT=1
    {% endif %}

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos    : True     # park somewhere specific, not the bed corner
variable_custom_park_x     : 7.0      # silicone nozzle stop
variable_custom_park_y     : 350.0
variable_custom_park_dz    : 2.0      # lift before travelling so nothing drags
variable_retract           : 1.0
variable_cancel_retract    : 5.0
variable_speed_retract     : 40.0
variable_unretract         : 1.0
variable_speed_unretract   : 30.0
variable_speed_hop         : 15.0
variable_speed_move        : 300.0
variable_park_at_cancel    : True
variable_park_at_cancel_x  : 7.0
variable_park_at_cancel_y  : 350.0
variable_use_fw_retract    : False
variable_idle_timeout      : 0
variable_user_pause_macro  : "_PAUSE_CLEAN"
variable_user_resume_macro : "_RESUME_CLEAN"
variable_user_cancel_macro : ""
gcode:
