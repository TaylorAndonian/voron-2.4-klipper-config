# ============================================================================
#  KAMP settings
#
#  CHANGED: Adaptive_Meshing is now DISABLED on purpose. Read why before you
#  turn it back on.
#
#  KAMP's Adaptive_Meshing.cfg redefines BED_MESH_CALIBRATE and calls the base
#  command with a FIXED argument list:
#      _BED_MESH_CALIBRATE mesh_min=.. mesh_max=.. ALGORITHM=.. PROBE_COUNT=..
#  It does not forward {rawparams}. So "BED_MESH_CALIBRATE METHOD=rapid_scan"
#  would silently lose METHOD, and the Eddy would fall back to slow
#  point-by-point probing instead of rapid scanning -- quietly, with no error.
#
#  Adaptive meshing existed to make SLOW contact probing bearable. A full-bed
#  Eddy rapid scan of your 350 takes well under a minute, and a full mesh is
#  reusable and cacheable. So the trade no longer favours adaptive.
#
#  If you do want adaptive meshing back, do NOT just uncomment the include --
#  copy Adaptive_Meshing.cfg into ~/printer_data/config/ as your own file and
#  append "METHOD=rapid_scan" to its _BED_MESH_CALIBRATE line.
# ============================================================================

#[include ./KAMP/Adaptive_Meshing.cfg]      # DISABLED - see note above
[include ./KAMP/Line_Purge.cfg]             # adaptive purge line
#[include ./KAMP/Voron_Purge.cfg]           # not used; LINE_PURGE is enough
[include ./KAMP/Smart_Park.cfg]             # park near the print before purging

[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for KAMP

variable_verbose_enable: True

# Mesh settings - inert while Adaptive_Meshing is disabled, kept for later.
variable_mesh_margin: 0
variable_fuzz_amount: 0

# No dockable probe on this machine. The Eddy is fixed to the Xol carriage.
variable_probe_dock_enable: False
variable_attach_macro: 'Attach_Probe'
variable_detach_macro: 'Dock_Probe'

# --- purge ------------------------------------------------------------------
variable_purge_height: 0.4       # was 0.8. 0.8 lays a rope that does not stick
                                 # and can be dragged into the print. 0.4 with
                                 # a 0.4 nozzle squishes properly.
variable_tip_distance: 2         # MUST match _CFG clean_retract / the retract
                                 # PRINT_END leaves behind. Yours is 2.0 mm.
                                 # This is what stops the first extrusion being
                                 # mostly air.
variable_purge_margin: 10
variable_purge_amount: 30
variable_flow_rate: 12

# --- smart park -------------------------------------------------------------
variable_smart_park_height: 10

gcode:
    {action_respond_info(" Running the KAMP_Settings macro does nothing, it is only used for storing KAMP settings. ")}
